<!DOCTYPE html>
<html lang="en">

    <style>

      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap");

      body {
        margin-left: 30px;
        margin-right: 30px;
        padding: 0;
        display: flex;
        justify-content: center;

        height: 90vh;
        background-color: #151515;
        color: #ffffff;
        font-family: "Inter", sans-serif;
        text-align: center;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .ggr {
        display: flex;
        gap: 2vw;
        flex-direction: row;
        margin-bottom: 1em;
      }

      .vector {
        fill: #ff1529;
        width: 2em;
        height: 2em;
      }

      .heading {
        font-size: 30px;
        font-weight: 600; /* Semibold */
        margin: 0;
      }

      .subheading {
        font-size: 20px;
        font-weight: 500; /* Medium */
        color: #999999;
        margin: 0;
      }

  </head>
