<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- TikTok Sans Variable Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wght,wdth@12..36,700,75..125&display=swap" rel="stylesheet">

  <title>TikTok Sans Width Animation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'TikTok Sans', sans-serif;
      background: black;
    }

    .text {
      display: flex;
      gap: 0.02em;
      font-size: clamp(80px, 10vw, 220px);
      font-weight: 700;
      line-height: 1;
      color: white;
      letter-spacing: -0.05em;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.18));
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    .letter {
      display: inline-block;
      animation: widthAnim 2.2s ease-in-out infinite alternate;
      will-change: font-variation-settings;
    }

    @keyframes widthAnim {
      0% {
        font-variation-settings:
          "wdth" 75,
          "wght" 700,
          "opsz" 36;

        transform: scaleY(1);
      }

      100% {
        font-variation-settings:
          "wdth" 125,
          "wght" 700,
          "opsz" 36;

        transform: scaleY(1.04);
      }
    }
  </style>
</head>
<body>

  <div class="text" id="text"></div>

  <script>
    const phrase = 'Введите текст';
    const container = document.getElementById('text');

    phrase.split('').forEach((char, index) => {
      const span = document.createElement('span');

      span.className = 'letter';
      span.innerHTML = char === ' ' ? '&nbsp;' : char;

      span.style.animationDelay = `${index * 0.08}s`;
      span.style.animationDuration = `${2 + Math.sin(index) * 0.6}s`;

      container.appendChild(span);
    });
  </script>

</body>
</html>
